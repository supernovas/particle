name: deploy

on:
  push:
    branches: [main]

# A rapid merge train collapses into one deploy; the VM clones main at boot,
# so whichever reset lands last builds the latest commit anyway.
concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, gcp]
    steps:
      - name: Reset the worker VM (rebuilds from main at boot)
        # The runner VM's service account can do exactly one thing: reset
        # particle-worker-0 (custom role + IAM condition in infra/gcp).
        # Metadata-token auth — no secrets in the repo or workflow.
        run: |
          TOKEN=$(curl -s -H "Metadata-Flavor: Google" \
            "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
            "https://compute.googleapis.com/compute/v1/projects/particle-production-506421/zones/us-central1-a/instances/particle-worker-0/reset" \
            | python3 -c "import sys,json;print('reset requested:', json.load(sys.stdin).get('status'))"
